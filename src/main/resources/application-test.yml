spring:
  h2:
    console:
      enabled: true
      path: /h2-console

  datasource:
    url: jdbc:h2:mem:tmp
    username: sa
    password:
    driver-class-name: org.h2.Driver



  jpa:
    properties:
      hibernate:
        show_sql: true
        format_sql: true

  redis:
    host: redis
    port: 6379


jwt:
  jwt-key: "zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz"

expiration-time:
  access: 1800000
  refresh: 86400000

logging:
  file:
    path: logs




